name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo # datas dos testes iguais às da equipe
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Nada é publicado se algo falhar (lint, testes unitários, build ou e2e).
      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build do app
        run: npm run build

      # e2e no build acima (scripts/serve-dist.mjs + Google Chrome, que já vem no runner ubuntu-latest).
      - name: Testes e2e
        run: npx playwright test

      - name: Guardar rastros do e2e (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rastros
          path: test-results/
          retention-days: 7

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
