name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo # datas dos testes iguais às da equipe
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Nada é publicado se algo falhar (lint, testes unitários, build ou e2e).
      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build do app
        run: npm run build

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # e2e no Windows: os testes de layout medem pixels com a Segoe UI, que só existe no Windows
  # (no Ubuntu a fonte substituta é mais larga e a barra superior quebra linha). Mesmo
  # ambiente da equipe; Google Chrome já vem no runner.
  e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes e2e (build + Playwright)
        run: npm run test:e2e

      - name: Guardar rastros do e2e (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rastros
          path: test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
